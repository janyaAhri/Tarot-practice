<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e211d">
  <title>ไพ่ทาโรต์ — โต๊ะดูดวงแม่หมอ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="phone" id="app">

    <header class="navbar">
      <button class="icon-btn" id="btn-library" type="button" aria-label="คลังไพ่ 78 ใบ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="11" height="17" rx="2"/><path d="M9 6h11a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H9"/></svg>
      </button>
      <div class="titles">
        <h1>ไพ่ทาโรต์</h1>
        <p id="subtitle"></p>
      </div>
      <button class="icon-btn" id="btn-notes" type="button" aria-label="สมุดโน้ต">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 11h6M9 15h6"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" type="button" aria-label="ตั้งค่า">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </header>

    <section class="table" id="table" aria-label="โต๊ะวางไพ่">
      <div class="spread" id="spread"></div>
    </section>

    <section class="deck" id="deck" aria-label="กองไพ่">
      <p class="deck-hint" id="deck-hint" aria-live="polite"></p>
      <div class="fan" id="fan"><div class="fan-track" id="fan-track"></div></div>
      <div class="deck-actions">
        <button class="btn" id="btn-shuffle" type="button">สับไพ่ใหม่</button>
        <button class="btn primary" id="btn-reveal-all" type="button" hidden>เปิดทุกใบ</button>
      </div>
    </section>

    <!-- ===== Sheet: ความหมายไพ่ ===== -->
    <div class="sheet-wrap" id="sheet-card">
      <div class="backdrop"></div>
      <section class="sheet" role="dialog" aria-label="ความหมายของไพ่">
        <div class="sheet-head"><div class="grabber"></div>
          <div class="sheet-title"><h2>ความหมายไพ่</h2><button class="close-btn" type="button" data-close>เสร็จ</button></div>
        </div>
        <div class="sheet-body" id="card-body"></div>
      </section>
    </div>

    <!-- ===== Sheet: ตั้งค่า ===== -->
    <div class="sheet-wrap" id="sheet-settings">
      <div class="backdrop"></div>
      <section class="sheet tall" role="dialog" aria-label="ตั้งค่า">
        <div class="sheet-head"><div class="grabber"></div>
          <div class="sheet-title"><h2>ตั้งค่า</h2><button class="close-btn" type="button" data-close>เสร็จ</button></div>
        </div>
        <div class="sheet-body" id="settings-body"></div>
      </section>
    </div>

    <!-- ===== Sheet: คลังไพ่ ===== -->
    <div class="sheet-wrap" id="sheet-library">
      <div class="backdrop"></div>
      <section class="sheet tall" role="dialog" aria-label="คลังไพ่">
        <div class="sheet-head"><div class="grabber"></div>
          <div class="sheet-title"><h2>คลังไพ่ 78 ใบ</h2><button class="close-btn" type="button" data-close>เสร็จ</button></div>
          <input id="lib-search" class="search" type="search" placeholder="ค้นหาชื่อไพ่หรือความหมาย เช่น อกหัก, The Tower">
          <div class="chips-row" id="lib-chips" role="group" aria-label="กรองตามชุด">
            <button type="button" data-suit="all" aria-pressed="true">ทั้งหมด</button>
            <button type="button" data-suit="major" aria-pressed="false">ใบใหญ่</button>
            <button type="button" data-suit="wands" aria-pressed="false">ไม้เท้า</button>
            <button type="button" data-suit="cups" aria-pressed="false">ถ้วย</button>
            <button type="button" data-suit="swords" aria-pressed="false">ดาบ</button>
            <button type="button" data-suit="pentacles" aria-pressed="false">เหรียญ</button>
          </div>
        </div>
        <div class="sheet-body">
          <p class="muted small" id="lib-count"></p>
          <div id="lib-body" class="lib-list"></div>
        </div>
      </section>
    </div>

    <!-- ===== Sheet: สมุดโน้ต ===== -->
    <div class="sheet-wrap" id="sheet-notes">
      <div class="backdrop"></div>
      <section class="sheet tall" role="dialog" aria-label="สมุดโน้ต">
        <div class="sheet-head"><div class="grabber"></div>
          <div class="sheet-title"><h2>สมุดโน้ต</h2><button class="close-btn" type="button" data-close>เสร็จ</button></div>
        </div>
        <div class="sheet-body" id="notes-body"></div>
      </section>
    </div>

    <!-- ===== Sheet: ประวัติข้อความ ===== -->
    <div class="sheet-wrap" id="sheet-log">
      <div class="backdrop"></div>
      <section class="sheet tall" role="dialog" aria-label="ข้อความที่ส่งเข้าแชท">
        <div class="sheet-head"><div class="grabber"></div>
          <div class="sheet-title"><h2>ข้อความที่ส่งเข้าแชท</h2><button class="close-btn" type="button" data-close>เสร็จ</button></div>
        </div>
        <div class="sheet-body" id="log-body"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status"></div>
  </div>

  <script src="data/cards.js"></script>
  <script src="data/spreads.js"></script>
  <script src="data/meanings-major.js"></script>
  <script src="data/meanings-minor.js"></script>
  <script src="data/meanings-index.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/reading.js"></script>
  <script src="js/table.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
